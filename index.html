<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catálogo de Electrodomésticos - 2026</title>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet"/>

    <!-- Metaetiquetas de Open Graph -->
    <meta property="og:title" content="Catálogo de Electrodomésticos - 2026">
    <meta property="og:description" content="Descubre nuestra amplia gama de televisores, aires acondicionados, refrigeradores, cocinas, lavadoras y más. Marcas reconocidas con garantía incluida.">
    <meta property="og:image" content="https://i.ibb.co/5XTQcvP8/Portada-Catalogo-Productos-2026.jpg">

    <!-- Metaetiquetas de Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Catálogo de Electrodomésticos - 2026">
    <meta name="twitter:description" content="Descubre nuestra amplia gama de televisores, aires acondicionados, refrigeradores, cocinas, lavadoras y más. Marcas reconocidas con garantía incluida.">
    <meta name="twitter:image" content="https://i.ibb.co/5XTQcvP8/Portada-Catalogo-Productos-2026.jpg">
    <meta name="twitter:url" content="https://newjosetbj2005-cyber.github.io/catalogo-interactivo-2026/">
    
    <style>
        :root {
            --bg: #f8f7f5;
            --bg2: #efe8e3;
            --bg3: #e5dcd4;
            --primary: #d4c5bc;
            --primary-light: #e8ddf7;
            --secondary: #8b2e3b;
            --secondary-dark: #6b1f2d;
            --secondary-light: #a84a5d;
            --text: #2b2b2b;
            --text-light: #5a5a5a;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 40px rgba(0,0,0,0.08);
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            display: none;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            overflow: hidden;
            transition: opacity 0.45s cubic-bezier(0.4,0,0.2,1);
        }

        .page.active {
            display: block;
            opacity: 1;
            pointer-events: all;
            position: relative;
            height: auto;
            overflow: visible;
        }

        #landing {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
        }

        .hero-carousel {
            width: 100%;
            height: 55vw;
            max-height: 440px;
            min-height: 220px;
            overflow: hidden;
            position: relative;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            animation: scroll-carousel 40s linear infinite;
            will-change: transform;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .carousel-item {
            flex: 0 0 auto;
            width: calc(55vw);
            max-width: 380px;
            min-width: 180px;
            height: 100%;
            padding: 0 6px;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius);
            display: block;
        }

        @keyframes scroll-carousel {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .hero-content {
            padding: 32px 24px 16px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .hero-brand {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--secondary);
            font-weight: 500;
        }

        .hero-title {
            font-family: 'Lora', serif;
            font-size: clamp(28px, 7vw, 52px);
            font-weight: 700;
            line-height: 1.1;
            color: var(--text);
        }

        .hero-title span {
            color: var(--secondary);
        }

        .hero-desc {
            font-size: clamp(14px, 3.5vw, 17px);
            color: var(--text-light);
            max-width: 480px;
            line-height: 1.6;
            font-weight: 300;
        }

        .hero-cta {
            background: var(--secondary);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: var(--transition);
            box-shadow: 0 4px 24px rgba(139,46,59,0.25);
        }

        .hero-cta:hover {
            background: var(--secondary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(139,46,59,0.4);
        }

        .social-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            transition: var(--transition);
            cursor: pointer;
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            transition: var(--transition);
        }

        .social-link:hover {
            transform: translateY(-3px);
            color: var(--secondary-dark);
        }

        #catalog {
            padding-top: 0;
        }

        .catalog-header {
            position: sticky;
            top: 0;
            background: var(--bg2);
            border-bottom: 1px solid var(--primary);
            padding: 20px;
            z-index: 100;
        }

        .catalog-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .catalog-title-block {
            flex: 1.3;
            margin: 0px 0px -10px 0px;
        }

        .catalog-title {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 5px 0px 3px 0px;
        }

        .catalog-subtitle {
            font-size: 12px;
            color: var(--text-light);
        }

        /* ── Filter wrapper con botones de scroll (solo PC) ── */
        .filter-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .filter-scroll-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            background: var(--bg2);
            color: var(--text);
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            z-index: 5;
        }

        .filter-scroll-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
            transform: scale(1.1);
        }

        .filter-scroll-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Estado oculto: invisible pero mantiene su espacio para no saltar el layout */
        .filter-scroll-btn.hidden-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.7);
        }

        /* En móviles los botones no existen */
        @media (max-width: 768px) {
            .filter-scroll-btn {
                display: none;
            }
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 6px;
            -ms-overflow-style: none;
            scrollbar-width: none;
            flex: 1;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .filter-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .filter-btn.active {
            background: var(--secondary);
            color: #ffffff;
            border-color: var(--secondary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            padding: 24px;
        }

        @media (max-width: 640px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
                padding: 20px;
            }
        }

        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 24px;
                padding: 32px;
            }
        }

        .product-card {
            background: var(--bg2);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }

        .product-card:hover {
            border-color: var(--secondary);
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(139,46,59,0.15);
        }

        .product-card.hidden {
            display: none;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--bg3);
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .card-img img {
            transform: scale(1.07);
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-cat {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--secondary);
            font-weight: 600;
        }

        .card-name {
            font-family: 'Lora', serif;
            font-size: clamp(13px, 2.5vw, 15px);
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-btn {
            margin-top: auto;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--secondary);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .card-btn:hover {
            background: var(--secondary);
            color: #ffffff;
            border-color: var(--secondary);
        }

        #detail {
            padding-top: 0;
            position: relative;
        }

        .detail-image-col {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        @media (max-width: 768px) {
            .detail-image-col {
                position: relative;
                height: auto;
            }
        }

        #detail .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            background: var(--secondary);
            color: #ffffff;
            border: none;
        }

        #detail .back-btn:hover {
            background: var(--secondary-dark);
            border-color: transparent;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            #detail .back-btn {
                top: 16px;
                left: 16px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        .detail-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 0;
            width: 100%;
            min-height: calc(100vh - 80px);
        }

        @media (max-width: 768px) {
            .detail-wrap {
                grid-template-columns: 1fr;
                gap: 0;
                padding: 0;
            }
        }

        .detail-carousel {
            position: relative;
            background: var(--bg3);
            border-radius: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            min-height: 320px;
            animation: slideIn 0.6s ease;
        }

        @media (max-width: 768px) {
            .detail-carousel {
                min-height: 60vw;
                border-radius: 0;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .detail-carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        .detail-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg3);
        }

        .detail-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .carousel-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active {
            width: 24px;
            border-radius: 4px;
            background: #ffffff;
        }

        /* ── Swipe hint ── */
        .swipe-hint {
            position: absolute;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            animation: hintAnim 3s ease forwards;
            z-index: 20;
        }

        .swipe-hint-hand {
            font-size: 32px;
            animation: handSwipe 1s ease-in-out 0.4s 2 alternate;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        }

        .swipe-hint-label {
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        @keyframes handSwipe {
            from { transform: translateX(0px); }
            to   { transform: translateX(-22px); }
        }

        @keyframes hintAnim {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ── Arrow navigation: hidden, navigation via swipe/thumbnails only ── */
        .carousel-arrow { display: none !important; }

        /* ── Thumbnail strip ── */
        .detail-thumbs {
            display: flex;
            gap: 8px;
            padding: 10px 12px 18px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg3);
            margin-bottom: 0;
        }
        .detail-thumbs::-webkit-scrollbar { display: none; }
        .detail-thumb {
            flex: 0 0 58px;
            height: 58px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            background: var(--bg3);
        }
        .detail-thumb img {
            width: 100%; height: 100%; object-fit: contain;
        }
        .detail-thumb.active {
            border-color: var(--secondary);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 32px 28px 32px;
            background: var(--bg2);
            border-radius: 0;
            overflow-y: auto;
            height: 100%;
        }

        @media (max-width: 768px) {
            .detail-info {
                padding: 20px 16px 32px;
                height: auto;
            }
        }

        .detail-cat {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--secondary);
            font-weight: 600;
        }

        .detail-name {
            font-family: 'Lora', serif;
            font-size: clamp(20px, 5.5vw, 30px);
            font-weight: 700;
            color: var(--text);
        }

        .detail-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .specs-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-top: 8px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border: 1px solid var(--primary);
        }

        .specs-table th {
            background: var(--primary);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text);
        }

        .specs-table td {
            padding: 10px;
            border-bottom: 1px solid var(--primary);
        }

        .specs-table tr:hover {
            background: #efe8e3;
        }

        .wa-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--secondary);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            margin-top: 8px;
        }

        .wa-btn:hover {
            background: var(--secondary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,46,59,0.3);
        }

        .wa-btn svg {
            width: 18px;
            height: 18px;
        }

        .placeholder-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%);
            color: var(--text-light);
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }
    </style>

</head>
<body>
    <div id="landing" class="page active">
        <div class="hero-carousel">
            <div class="carousel-track" id="carouselTrack">
            </div>
        </div>

        <div class="hero-content">
            <span class="hero-brand">Electrodomésticos Premium</span>
            <h1 class="hero-title">Electrodomésticos de <span>Calidad</span></h1>
            <p class="hero-desc">Descubre nuestra amplia gama de televisores, aires acondicionados, refrigeradores, cocinas, lavadoras y más. Marcas reconocidas con garantía incluida.</p>
            <button class="hero-cta" id="cta-button">Explorar Catálogo</button>
        </div>

        <div class="social-bar">
            <a href="https://wa.me/584121402126" id="wa-portada" target="_blank" class="social-link" title="WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
                WhatsApp
            </a>
        </div>
    </div>

    <div id="catalog" class="page">
        <div class="catalog-header">
            <div class="catalog-top">
                <button class="back-btn" id="back-catalog-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;">
                        <path d="M19 11H7.83l5.59-5.59L12 3l-9 9 9 9 1.41-1.41L7.83 13H19v-2z"/>
                    </svg>
                    Atrás
                </button>
                <div class="catalog-title-block">
                    <h2 class="catalog-title">Catálogo de Productos</h2>
                    <p class="catalog-subtitle">Selecciona una categoría para filtrar</p>
                </div>
            </div>

            <div class="filter-wrapper">
                <button class="filter-scroll-btn hidden-btn" id="filterBtnLeft" onclick="scrollFilter(-1)" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="filter-bar" id="filterBar">
                    <button class="filter-btn active" onclick="filterCat('all', this)">Todos</button>
                </div>
                <button class="filter-scroll-btn" id="filterBtnRight" onclick="scrollFilter(1)" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
        </div>
    </div>

    <div id="detail" class="page">
        <div id="detailContent">
        </div>
    </div>

        function setupEventListeners() {
            document.getElementById('cta-button').addEventListener('click', showCatalog);
            document.getElementById('back-catalog-btn').addEventListener('click', handleBack);
        }

        function scrollFilter(dir) {
            var bar = document.getElementById('filterBar');
            if (!bar) return;
            bar.scrollBy({ left: dir * 220, behavior: 'smooth' });
        }

        function updateFilterBtns() {
            var bar = document.getElementById('filterBar');
            var btnL = document.getElementById('filterBtnLeft');
            var btnR = document.getElementById('filterBtnRight');
            if (!bar || !btnL || !btnR) return;
            var atStart = bar.scrollLeft <= 4;
            var atEnd = bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 4;
            btnL.classList.toggle('hidden-btn', atStart);
            btnR.classList.toggle('hidden-btn', atEnd);
        }

        function initFilterScroll() {
            var bar = document.getElementById('filterBar');
            if (!bar) return;
            bar.addEventListener('scroll', updateFilterBtns, { passive: true });
            // Also update on resize in case content changes
            window.addEventListener('resize', updateFilterBtns);
            updateFilterBtns();
        }

        function renderCarousel() {
            var track = document.getElementById('carouselTrack');
            var items = '';
            // Usar los primeros 6 productos para el carrusel
            var carouselProducts = PRODUCTS.slice(0, 6);
            for (var i = 0; i < carouselProducts.length; i++) {
                var product = carouselProducts[i];
                if (product.img) {
                    items += '<div class="carousel-item"><img src="' + product.img + '" alt="' + product.name + '"/></div>';
                } else {
                    items += '<div class="carousel-item"><div class="placeholder-img">Imagen Promocional</div></div>';
                }
            }
            // Duplicar para efecto infinito
            track.innerHTML = items + items;
        }

        function renderProducts() {
            var grid = document.getElementById('productsGrid');
            var html = '';
            for (var i = 0; i < PRODUCTS.length; i++) {
                var product = PRODUCTS[i];
                var imgHtml = product.img ? '<img src="' + product.img + '" alt="' + product.name + '"/>' : '<div class="placeholder-img">Sin imagen<br><small>' + product.id + '</small></div>';
                html += '<div class="product-card" data-category="' + product.category + '" onclick="showProduct(\'' + product.id + '\')">' +
                    '<div class="card-img">' + imgHtml + '</div>' +
                    '<div class="card-body">' +
                    '<span class="card-cat">' + product.cat_label + '</span>' +
                    '<h3 class="card-name">' + product.name + '</h3>' +
                    '<p class="card-desc">' + product.desc + '</p>' +
                    '<button class="card-btn">Ver Detalles</button>' +
                    '</div>' +
                    '</div>';
            }
            grid.innerHTML = html;
        }

        function renderFilters() {
            var filterBar = document.getElementById('filterBar');
            var categories = {};
            for (var i = 0; i < PRODUCTS.length; i++) {
                var cat = PRODUCTS[i].category;
                if (!categories[cat]) {
                    categories[cat] = PRODUCTS[i].cat_label;
                }
            }
            
            // Orden personalizado de categorías
            var order = ['televisores', 'smartphones_tebletas_y_laptos', 'aires', 'neveras', 'lavadoras', 'cocinas_hornos_y_Campanas', 'electrodomesticos',  'hogar', 'limpieza-organizacion', 'cuidado_personal', 'protectores', 'bombas',  'muebles'];
            
            for (var j = 0; j < order.length; j++) {
                var catId = order[j];
                if (categories[catId]) {
                    var btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.textContent = categories[catId];
                    btn.onclick = (function(cId) {
                        return function() {
                            filterCat(cId, this);
                        };
                    })(catId);
                    filterBar.appendChild(btn);
                }
            }
            // Refresh button visibility now that all filters are rendered
            setTimeout(updateFilterBtns, 50);
        }

        function navigateTo(targetId) {
            if (isTransitioning || currentPage === targetId) return;
            isTransitioning = true;

            var fromEl = document.getElementById(currentPage);
            var toEl = document.getElementById(targetId);

            fromEl.style.opacity = '0';
            fromEl.style.pointerEvents = 'none';

            setTimeout(function() {
                fromEl.classList.remove('active');
                fromEl.style.opacity = '';
                fromEl.style.pointerEvents = '';

                toEl.classList.add('active');
                toEl.style.opacity = '0';
                window.scrollTo(0, 0);

                toEl.getBoundingClientRect();
                toEl.style.opacity = '';

                currentPage = targetId;
                setTimeout(function() {
                    isTransitioning = false;
                }, 480);
            }, 420);
        }

        function showCatalog() {
            navigateTo('catalog');
        }

        function handleBack() {
            if (currentPage === 'catalog') {
                navigateTo('landing');
            } else if (currentPage === 'detail') {
                navigateTo('catalog');
            }
        }

        function filterCat(cat, btn) {
            var allBtns = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.remove('active');
            }
            btn.classList.add('active');
            
            var allCards = document.querySelectorAll('.product-card');
            for (var j = 0; j < allCards.length; j++) {
                if (cat === 'all' || allCards[j].dataset.category === cat) {
                    allCards[j].classList.remove('hidden');
                } else {
                    allCards[j].classList.add('hidden');
                }
            }
        }

        function showProduct(pid) {
            var p = null;
            for (var i = 0; i < PRODUCTS.length; i++) {
                if (PRODUCTS[i].id === pid) { p = PRODUCTS[i]; break; }
            }
            if (!p) return;

            // Build image list: use p.imgs if available, fallback to p.img
            var images = [];
            if (p.imgs && p.imgs.length > 0) {
                images = p.imgs;
            } else if (p.img) {
                images = [p.img];
            }

            var specsRows = '';
            for (var j = 0; j < p.specs.length; j++) {
                specsRows += '<tr><td>' + p.specs[j][0] + '</td><td>' + p.specs[j][1] + '</td></tr>';
            }

            var msg = 'Hola! Estoy interesado en: ' + p.name + '. Quisiera conocer precio y disponibilidad.';
            var waLink = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);

            // Build slides
            var slidesHtml = '';
            for (var s = 0; s < images.length; s++) {
                slidesHtml += '<div class="detail-slide"><img src="' + images[s] + '" alt="' + p.name + ' vista ' + (s+1) + '"/></div>';
            }

            // Build dots
            var dotsHtml = '';
            for (var d = 0; d < images.length; d++) {
                dotsHtml += '<div class="dot' + (d===0?' active':'') + '" onclick="goSlide(' + d + ')"></div>';
            }

            // Build thumbnails (only if more than 1 image)
            var thumbsHtml = '';
            if (images.length > 1) {
                thumbsHtml = '<div class="detail-thumbs" id="detailThumbs">';
                for (var t = 0; t < images.length; t++) {
                    thumbsHtml += '<div class="detail-thumb' + (t===0?' active':'') + '" onclick="goSlide(' + t + ')"><img src="' + images[t] + '" alt=""/></div>';
                }
                thumbsHtml += '</div>';
            }

            // Swipe hint (only if more than 1 image)
            var hintHtml = '';
            if (images.length > 1) {
                hintHtml = '<div class="swipe-hint" id="swipeHint">' +
                    '<div class="swipe-hint-hand">👆</div>' +
                    '<div class="swipe-hint-label">Desliza para ver más fotos</div>' +
                    '</div>';
            }

            // Arrows
            var prevArrow = images.length > 1 ? '<button class="carousel-arrow prev" id="carArrowPrev" onclick="slideArrow(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>' : '';
            var nextArrow = images.length > 1 ? '<button class="carousel-arrow next" id="carArrowNext" onclick="slideArrow(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>' : '';

            var detailHTML =
                '<button class="back-btn" onclick="handleBack()" style="position:fixed;top:16px;left:16px;z-index:1000;background:var(--secondary);color:white;border:none;">' +
                '<svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M19 11H7.83l5.59-5.59L12 3l-9 9 9 9 1.41-1.41L7.83 13H19v-2z"/></svg> Atrás</button>' +
                '<div class="detail-wrap">' +
                  '<div class="detail-image-col">' +
                    '<div class="detail-carousel" id="detailCarousel">' +
                      '<div class="detail-carousel-track" id="detailTrack">' + slidesHtml + '</div>' +
                      prevArrow + nextArrow +
                      '<div class="carousel-dots" id="carouselDots">' + dotsHtml + '</div>' +
                      hintHtml +
                    '</div>' +
                    thumbsHtml +
                  '</div>' +
                  '<div class="detail-info">' +
                    '<p class="detail-cat">' + p.cat_label + '</p>' +
                    '<h1 class="detail-name">' + p.name + '</h1>' +
                    '<p class="detail-desc">' + p.desc + '</p>' +
                    '<p class="specs-title">Especificaciones</p>' +
                    '<table class="specs-table"><thead><tr><th>Característica</th><th>Valor</th></tr></thead><tbody>' + specsRows + '</tbody></table>' +
                    '<a href="' + waLink + '" target="_blank" class="wa-btn">' +
                    '<svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>' +
                    'Consultar por WhatsApp</a>' +
                  '</div>' +
                '</div>';

            document.getElementById('detailContent').innerHTML = detailHTML;
            currentSlide = 0;
            totalSlides = images.length;

            // Touch/swipe support
            var carousel = document.getElementById('detailCarousel');
            if (carousel && totalSlides > 1) {
                var touchStartX = 0;
                carousel.addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
                carousel.addEventListener('touchend', function(e){
                    var dx = e.changedTouches[0].clientX - touchStartX;
                    if (Math.abs(dx) > 40) slideArrow(dx < 0 ? 1 : -1);
                }, {passive:true});
            }

            navigateTo('detail');
        }

        var currentSlide = 0;
        var totalSlides = 1;

        function goSlide(index) {
            var track = document.getElementById('detailTrack');
            if (!track) return;
            currentSlide = Math.max(0, Math.min(index, totalSlides - 1));
            track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
            // Update dots
            var dots = document.querySelectorAll('#carouselDots .dot');
            for (var i = 0; i < dots.length; i++) {
                dots[i].classList.toggle('active', i === currentSlide);
            }
            // Update thumbnails
            var thumbs = document.querySelectorAll('#detailThumbs .detail-thumb');
            for (var t = 0; t < thumbs.length; t++) {
                thumbs[t].classList.toggle('active', t === currentSlide);
            }
        }

        function slideArrow(dir) {
            goSlide(currentSlide + dir);
        }
    </script>
